name: govulncheck

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  # Advisories are published against code that hasn't changed, so scan daily too.
  schedule:
  - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The standard library is checked at the go directive's version: the oldest
    # Go this module accepts, so raising it is how a Go security fix is taken.
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          tools/go.sum

    - name: Run govulncheck
      run: go -C tools run golang.org/x/vuln/cmd/govulncheck -C .. ./...
